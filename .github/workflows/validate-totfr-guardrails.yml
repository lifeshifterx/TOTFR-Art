name: Validate TOTFR Guardrails

# AGENTS.md and the full pinned control plane are mandatory inputs; every PR is validated.
'on':
  push:
    branches: [development]
  pull_request:

permissions:
  contents: read

concurrency:
  group: totfr-guardrails-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - name: Validate base guardrails, SOP budgets, evidence bindings, and Surface Matrix
        run: python tools/validate_totfr_guardrails.py
      - name: Prove base guardrails reject known bad states
        run: python tools/test_totfr_guardrails.py
      - name: Validate multi-agent transactional deployment controls
        run: python tools/validate_totfr_agent_controls.py
      - name: Prove agent controls reject fraudulent deployment states
        run: python tools/test_totfr_agent_controls.py
      - name: Validate runtime identity and durable evidence trust
        run: python tools/validate_totfr_runtime_trust.py
      - name: Prove runtime trust rejects unsafe states
        run: python tools/test_totfr_runtime_trust.py
      - name: Verify live GitHub integration protection
        run: python tools/validate_totfr_live_protection.py
        env:
          GITHUB_TOKEN: ${{ github.token }}
