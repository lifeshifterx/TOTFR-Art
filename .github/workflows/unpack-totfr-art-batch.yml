name: Unpack TOTFR Art Batch

on:
  push:
    branches:
      - development
    paths:
      - '_staging/totfr_art_batch.zip'

permissions:
  contents: write

jobs:
  unpack:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out development
        uses: actions/checkout@v4
        with:
          ref: development
          fetch-depth: 0

      - name: Expand production assets
        run: |
          unzip -o _staging/totfr_art_batch.zip -d .
          rm -f _staging/totfr_art_batch.zip

      - name: Commit individual assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No asset changes to commit."
            exit 0
          fi
          git commit -m "Expand TOTFR production art batch"
          git push origin HEAD:development
