name: Validate TOTFR Guardrails

'on':
  push:
    branches: [development]
    paths:
      - 'README.md'
      - '13 Source Prompts/**'
      - 'tools/validate_totfr_guardrails.py'
      - '.github/workflows/validate-totfr-guardrails.yml'
  pull_request:
    paths:
      - 'README.md'
      - '13 Source Prompts/**'
      - 'tools/validate_totfr_guardrails.py'
      - '.github/workflows/validate-totfr-guardrails.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate guardrails, SOP budgets, and Surface Matrix
        run: python tools/validate_totfr_guardrails.py
